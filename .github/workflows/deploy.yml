name: Deploy Vote Operations to GitHub Pages
run-name: Deploy latest Vote operations — ${{ github.sha }}

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: vote-pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Test authentication helpers
        run: npm test

      - name: Refresh public Raajje.mv headlines
        run: python3 scripts/update_raajje_headlines.py

      - name: Refresh public MDP announcements
        run: python3 scripts/update_mdp_announcements.py

      - name: Refresh Elections Commission news
        run: python3 scripts/update_ec_news.py

      - name: Build latest static site
        run: npm run build

      - name: Verify exported homepage
        run: test -f out/index.html

      - name: Disable Jekyll
        run: touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    if: ${{ needs.build.result == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy latest artifact
        id: deployment
        uses: actions/deploy-pages@v4

